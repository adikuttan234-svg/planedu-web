<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Access | planEDU</title>

  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <script src="theme.js"></script>

  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      background: var(--bg-soft);
      position: relative;
    }

    .top-controls {
      position: absolute;
      top: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 40px;
      background: var(--bg-card);
      border: 1px solid var(--border-base);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-logo {
      width: 52px;
      height: 52px;
      background: var(--brand-primary);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 1.6rem;
      font-weight: 800;
      margin: 0 auto 20px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    .auth-title {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      color: var(--text-muted);
      font-size: 0.925rem;
    }

    .footer-link {
      text-align: center;
      margin-top: 28px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .footer-link a {
      color: var(--brand-primary);
      font-weight: 600;
    }

    .footer-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="top-controls">
    <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle color theme" aria-label="Toggle theme">
      <i class="ri-moon-line"></i>
    </button>
    <a href="index.html" class="btn btn-secondary btn-sm">
      <i class="ri-home-4-line"></i>
      <span>Home</span>
    </a>
  </div>

  <div class="auth-card animate-fade-up">
    <div class="auth-header">
      <a href="index.html" style="display: inline-block;">
        <div class="auth-logo">P</div>
      </a>
      <h1 class="auth-title">Welcome to planEDU</h1>
      <p class="auth-subtitle">Enter your institutional credentials to access your portal</p>
    </div>

    <form onsubmit="event.preventDefault(); login();">
      <div class="form-group">
        <label class="form-label" for="email">Institutional Email</label>
        <input id="email" type="email" class="input-field" placeholder="name@institution.edu" autocomplete="email" required>
        <div class="error-msg" id="emailError"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" type="password" class="input-field" placeholder="••••••••" autocomplete="current-password" required>
        <div class="error-msg" id="passwordError"></div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 6px;">
        <span>Sign In</span>
        <i class="ri-arrow-right-line"></i>
      </button>
    </form>

    <div class="footer-link">
      Need an institutional account? <a href="register.html">Register here</a>
    </div>
  </div>

  <script>
    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const emailError = document.getElementById("emailError");
      const passwordError = document.getElementById("passwordError");
      const btn = document.getElementById("submitBtn");

      emailError.textContent = "";
      passwordError.textContent = "";

      if (!email) {
        emailError.textContent = "Institutional email is required";
        return;
      }
      if (!password) {
        passwordError.textContent = "Security password is required";
        return;
      }

      const originalHTML = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="ri-loader-4-line ri-spin"></i> Authenticating...';

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          passwordError.textContent = data.message || "Invalid credentials. Please verify your email and password.";
          btn.disabled = false;
          btn.innerHTML = originalHTML;
          return;
        }

        sessionStorage.setItem("user", JSON.stringify(data.user));
        sessionStorage.setItem("token", data.token);

        // Redirect based on role
        const role = data.user.role;
        if (role === "ADMIN") location.href = "admin.html";
        else if (role === "FACULTY") location.href = "faculty.html";
        else if (role === "STUDENT") location.href = "student.html";
        else location.href = "index.html";

      } catch (err) {
        passwordError.textContent = "Unable to reach institutional server. Please ensure the backend is running.";
        btn.disabled = false;
        btn.innerHTML = originalHTML;
      }
    }
  </script>
</body>

</html>
