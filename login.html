<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | planEDU</title>

  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-soft);
      background-image: radial-gradient(circle at 0% 0%, rgba(79, 70, 229, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(14, 165, 233, 0.05) 0%, transparent 50%);
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 48px;
      background: var(--bg-card);
      border: 1px solid var(--border-base);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .auth-logo {
      width: 56px;
      height: 56px;
      background: var(--brand-primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 1.8rem;
      font-weight: 800;
      margin: 0 auto 24px;
    }

    .auth-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .auth-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-strong);
      margin-bottom: 8px;
    }

    .error-msg {
      font-size: 0.85rem;
      color: var(--error);
      margin-top: 6px;
      min-height: 20px;
    }

    .footer-link {
      text-align: center;
      margin-top: 32px;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .footer-link a {
      color: var(--brand-primary);
      font-weight: 700;
    }

    .footer-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="auth-card animate-fade-up">
    <div class="auth-header">
      <div class="auth-logo">P</div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Enter your credentials to access the portal</p>
    </div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input id="email" type="email" class="input-field" placeholder="name@institution.edu">
      <div class="error-msg" id="emailError"></div>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input id="password" type="password" class="input-field" placeholder="••••••••">
      <div class="error-msg" id="passwordError"></div>
    </div>

    <button onclick="login()" class="btn btn-primary"
      style="width: 100%; padding: 14px; font-size: 1rem; margin-top: 8px;">
      Sign In
      <i class="ri-arrow-right-line"></i>
    </button>

    <div class="footer-link">
      Don't have an account? <a href="register.html">Create Institutional account</a>
    </div>
  </div>

  <script>
    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const emailError = document.getElementById("emailError");
      const passwordError = document.getElementById("passwordError");

      emailError.textContent = "";
      passwordError.textContent = "";

      if (!email) {
        emailError.textContent = "Institutional email is required";
        return;
      }
      if (!password) {
        passwordError.textContent = "Security password is required";
        return;
      }

      try {
        // Showing a simple loading state
        const btn = document.querySelector('button');
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="ri-loader-4-line ri-spin"></i> Authenticating...';

        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          passwordError.textContent = data.message || "Invalid credentials";
          btn.disabled = false;
          btn.innerHTML = originalText;
          return;
        }

        sessionStorage.setItem("user", JSON.stringify(data.user));
        sessionStorage.setItem("token", data.token);

        // Redirect based on role
        const role = data.user.role;
        if (role === "ADMIN") location.href = "admin.html";
        else if (role === "FACULTY") location.href = "faculty.html";
        else if (role === "STUDENT") location.href = "student.html";
        else location.href = "index.html";

      } catch (err) {
        passwordError.textContent = "Network error: Institutional server unreachable";
        const btn = document.querySelector('button');
        btn.disabled = false;
        btn.innerHTML = 'Sign In <i class="ri-arrow-right-line"></i>';
      }
    }

    // Initialize theme from localStorage
    const theme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  </script>
</body>

</html>
