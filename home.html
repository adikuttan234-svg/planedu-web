<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Faculty Home</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  background: white;
  border-bottom: 1px solid #ccc;
}
nav {
  padding: 15px;
}
nav button {
  padding: 8px 14px;
  margin-right: 8px;
}
section {
  padding: 20px;
  display: none;
}
table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}
th, td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: center;
}
th {
  background: #eee;
}
</style>
</head>
<body>

<header>
<h2>Faculty Dashboard</h2>
<button onclick="logout()">Logout</button>
</header>

<nav>
<button onclick="showSection('profile')">Profile</button>
<button onclick="showSection('timetable')">Timetable</button>
<button onclick="showSection('workload')">Workload</button>
<button onclick="showSection('graph')">Work Graph</button>
</nav>

<section id="profile"></section>
<section id="timetable"></section>
<section id="workload"></section>
<section id="graph"></section>

<script src="faculty-home.js"></script>
</body>
</html>
